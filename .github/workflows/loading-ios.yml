name: Morgan iPhoneOS Frameworks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and validate Debug iPhoneOS framework
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/morgan-launcher-debug"
          mkdir -p "$out"
          bash MorganLauncherNative/build-ios.sh "$out" "$GITHUB_WORKSPACE/NativeSource" Debug \
            2>&1 | tee "$out/build.log"
      - name: Build and validate Release iPhoneOS framework
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/morgan-launcher"
          mkdir -p "$out"
          bash MorganLauncherNative/build-ios.sh "$out" "$GITHUB_WORKSPACE/NativeSource" Release \
            2>&1 | tee "$out/build.log"
          COPYFILE_DISABLE=1 tar -C "$out" -cf "$out/MorganLauncher.framework.tar" MorganLauncher.framework
      - name: Upload Release Framework and verification results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: MorganLauncher-iPhoneOS-ARM64
          path: |
            ${{ runner.temp }}/morgan-launcher/MorganLauncher.framework.tar
            ${{ runner.temp }}/morgan-launcher/SHA256SUMS
            ${{ runner.temp }}/morgan-launcher/dsym-uuid.txt
            ${{ runner.temp }}/morgan-launcher/exports-after-strip.txt
            ${{ runner.temp }}/morgan-launcher/build.log
            ${{ runner.temp }}/morgan-launcher-debug/build.log
          if-no-files-found: error
